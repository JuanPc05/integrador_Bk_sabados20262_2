# ============================================================
#  Aplicación
# ============================================================
spring.application.name=proyecta-backend

# ============================================================
#  Base de datos — MySQL / MariaDB
#  IDÉNTICO para todos, corras MySQL o MariaDB. El driver de MySQL
#  conecta contra ambos porque comparten protocolo de red.
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/proyecta_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC

# Credenciales por variable de entorno, con valor por defecto tras los ':'.
# Así NADIE sube su contraseña al repo y cada quien usa la suya en local.
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}


# ============================================================
#  JPA / Hibernate
# ============================================================
# NO fijamos 'dialect' a propósito: Hibernate lo autodetecta según la
# BD conectada. Mismo archivo → dialecto correcto en MariaDB y en MySQL.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
